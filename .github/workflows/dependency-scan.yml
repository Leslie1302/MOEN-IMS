name: Dependency Scan
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit
      # Audit the actual production requirements file. This step BLOCKS the
      # pipeline on vulnerable dependencies. Add `--ignore-vuln <ID>` with a
      # written justification only when a fix is genuinely unavailable.
      - name: Run pip-audit (blocking)
        run: |
          pip-audit -r IMS/Inventory_management_system/requirements.txt --strict
