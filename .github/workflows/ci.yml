name: CI (checks + tests)

# Quality gate. Configure this workflow as a REQUIRED status check on `main`
# (Settings -> Branches -> Branch protection) so the Azure deploy never ships
# code that fails checks, migrations, or tests.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

defaults:
  run:
    working-directory: IMS/Inventory_management_system

jobs:
  checks-and-tests:
    runs-on: ubuntu-latest
    env:
      # Run as production-like as is safe in CI: surface deploy-check warnings,
      # but keep DEBUG on so a dev SECRET_KEY/SQLite are available for the run.
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: System libraries (optional decoders)
        run: sudo apt-get update && sudo apt-get install -y libzbar0 poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage ruff

      - name: Ruff (lint real bugs — blocking)
        run: ruff check .

      - name: Ruff (format check — informational)
        continue-on-error: true
        run: ruff format --check .

      - name: Guard against inert ratelimit method='ALL'
        # django-ratelimit treats the *string* 'ALL' as a literal HTTP method
        # named "ALL", which matches no real request and silently disables the
        # limit. The correct value is the imported `ALL` sentinel. Block the
        # string form so the inert-throttle bug can't recur. (See HARDENING_PLAN.md 1d.)
        run: |
          if grep -rnE "ratelimit\([^)]*method=['\"]ALL['\"]" --include='*.py' .; then
            echo "::error::Use the imported ALL sentinel, not the string 'ALL', in @ratelimit — the string silently disables the limit."
            exit 1
          fi
          echo "OK: no string method='ALL' in @ratelimit decorators."

      - name: Django system check (deploy)
        # Surface security/deploy misconfigurations. Does not fail on warnings
        # yet; tighten to --fail-level WARNING once the existing warnings are
        # triaged.
        run: python manage.py check --deploy

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --verbosity=2
          coverage report
