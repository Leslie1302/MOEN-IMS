{% extends 'Inventory/base.html' %}
{% load static %}

{% block title %}Total Sites - Ghana Map{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
    :root {
        --primary-color: #2c3e50;
        --info-color: #2196f3;
        --light-gray: #f8f9fa;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--light-gray);
    }

    .header {
        background: white;
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h1 {
        font-size: 32px;
        font-weight: 700;
        color: var(--primary-color);
        margin: 0;
    }

    .btn-back {
        padding: 10px 20px;
        background: white;
        color: var(--primary-color);
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
    }

    .btn-back:hover {
        background: var(--light-gray);
    }

    .container {
        padding: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-label {
        font-size: 12px;
        color: #999;
        text-transform: uppercase;
        margin-bottom: 10px;
        font-weight: 600;
    }

    .stat-value {
        font-size: 36px;
        font-weight: 700;
        color: var(--info-color);
    }

    .table-container {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .table-title {
        padding: 20px 25px;
        border-bottom: 2px solid var(--info-color);
        font-size: 18px;
        font-weight: 700;
        color: var(--primary-color);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: var(--light-gray);
    }

    th {
        padding: 15px 25px;
        text-align: left;
        font-weight: 700;
        color: var(--primary-color);
        border-bottom: 2px solid #ddd;
    }

    td {
        padding: 12px 25px;
        border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
        background: #f9f9f9;
    }

    .status-pill {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        color: white;
    }

    .status-completed { background: #00aa00; }
    .status-active { background: #ffc107; color: black; }
    .status-planned { background: #6c757d; }
    .status-on-hold { background: #dc3545; }

    .loading {
        text-align: center;
        padding: 40px;
        font-size: 18px;
        color: #999;
    }
</style>
{% endblock %}

{% block content %}
<div class="header">
    <h1>Total Project Sites Nationwide</h1>
    <button class="btn-back" onclick="window.history.back()">← Back to Map</button>
</div>

<div class="container">
    <div class="stats-grid" id="statsGrid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading statistics...</div>
    </div>

    <div class="table-container">
        <div class="table-title">All Project Sites</div>
        <div id="tableContainer">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading sites...</div>
        </div>
    </div>
</div>

<script>
    function loadData() {
        // Load statistics
        fetch('/api/ghana-map-stats/')
            .then(r => r.json())
            .then(stats => {
                const sites = stats.sites || {};
                const html = `
                    <div class="stat-card">
                        <div class="stat-label">Total Sites</div>
                        <div class="stat-value">${sites.total || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value">${sites.completed || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Active</div>
                        <div class="stat-value">${sites.active || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Planned</div>
                        <div class="stat-value">${sites.planned || 0}</div>
                    </div>
                `;
                document.getElementById('statsGrid').innerHTML = html;
            });

        // Load sites table
        fetch('/api/ghana-map-project-sites/')
            .then(r => r.json())
            .then(data => {
                const sites = data.features || [];
                let html = '<table><thead><tr><th>Site Name</th><th>Code</th><th>Region</th><th>District</th><th>Status</th><th>Completion</th></tr></thead><tbody>';

                sites.forEach(site => {
                    const props = site.properties;
                    html += `
                        <tr>
                            <td><strong>${props.name}</strong></td>
                            <td>${props.code}</td>
                            <td>${props.region}</td>
                            <td>${props.district}</td>
                            <td><span class="status-pill status-${props.status.toLowerCase().replace(' ', '-')}">${props.status}</span></td>
                            <td>${props.completion_percentage}%</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                document.getElementById('tableContainer').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('tableContainer').innerHTML = `<div style="padding: 20px; color: red;">Error loading data: ${err.message}</div>`;
            });
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
