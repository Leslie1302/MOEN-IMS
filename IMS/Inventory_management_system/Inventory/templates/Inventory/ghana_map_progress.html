{% extends 'Inventory/base.html' %}
{% load static %}

{% block title %}National Progress - Ghana Map{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
    :root {
        --primary-color: #2c3e50;
        --cyan: #00bcd4;
        --light-gray: #f8f9fa;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--light-gray);
    }

    .header {
        background: linear-gradient(135deg, var(--cyan) 0%, #0097a7 100%);
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    .header h1 {
        font-size: 32px;
        font-weight: 700;
        margin: 0;
    }

    .btn-back {
        padding: 10px 20px;
        background: white;
        color: var(--cyan);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .container {
        padding: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        border-left: 4px solid var(--cyan);
    }

    .stat-label {
        font-size: 12px;
        color: #999;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .stat-value {
        font-size: 36px;
        font-weight: 700;
        color: var(--cyan);
    }

    .regional-breakdown {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .breakdown-title {
        padding: 20px 25px;
        border-bottom: 2px solid var(--cyan);
        font-size: 18px;
        font-weight: 700;
        color: var(--primary-color);
    }

    .breakdown-content {
        padding: 25px;
    }

    .region-item {
        padding: 20px;
        margin-bottom: 15px;
        background: var(--light-gray);
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--cyan);
    }

    .region-name {
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 8px;
    }

    .progress-bar {
        width: 200px;
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #00bcd4, #0097a7);
    }

    .region-stats {
        display: flex;
        gap: 20px;
        font-size: 13px;
    }

    .region-stat {
        display: flex;
        flex-direction: column;
    }

    .stat-label-small {
        font-size: 11px;
        color: #999;
        margin-bottom: 3px;
    }

    .stat-value-small {
        font-weight: 700;
        color: var(--primary-color);
    }

    .percentage {
        font-weight: 700;
        color: var(--cyan);
        font-size: 16px;
    }

    .loading {
        text-align: center;
        padding: 40px;
        font-size: 18px;
        color: #999;
    }
</style>
{% endblock %}

{% block content %}
<div class="header">
    <h1>National Progress Overview</h1>
    <button class="btn-back" onclick="window.history.back()">← Back to Map</button>
</div>

<div class="container">
    <div class="stats-grid" id="statsGrid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading statistics...</div>
    </div>

    <div class="regional-breakdown">
        <div class="breakdown-title">Regional Completion Breakdown</div>
        <div class="breakdown-content" id="breakdownContent">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading regional data...</div>
        </div>
    </div>
</div>

<script>
    function loadData() {
        Promise.all([
            fetch('/api/ghana-map-stats/').then(r => r.json()),
            fetch('/api/ghana-map-region-heatmap/').then(r => r.json())
        ])
            .then(([stats, regionData]) => {
                const completion = stats.completion || {};
                const sites = stats.sites || {};

                // Stats Grid
                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-label">Overall Progress</div>
                        <div class="stat-value">${(completion.percentage || 0).toFixed(1)}%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value">${sites.completed || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">In Progress</div>
                        <div class="stat-value">${sites.active || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Planned</div>
                        <div class="stat-value">${sites.planned || 0}</div>
                    </div>
                `;
                document.getElementById('statsGrid').innerHTML = statsHtml;

                // Regional breakdown
                const regions = regionData.features || [];
                let breakdownHtml = '';

                regions.forEach(region => {
                    const props = region.properties;
                    const percentage = props.completion_rate || 0;
                    breakdownHtml += `
                        <div class="region-item">
                            <div style="flex: 1;">
                                <div class="region-name">${props.name}</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                </div>
                            </div>
                            <div class="region-stats">
                                <div class="region-stat">
                                    <div class="stat-label-small">Completed</div>
                                    <div class="stat-value-small">${props.completed_sites}</div>
                                </div>
                                <div class="region-stat">
                                    <div class="stat-label-small">Active</div>
                                    <div class="stat-value-small">${props.active_sites}</div>
                                </div>
                                <div class="region-stat">
                                    <div class="stat-label-small">Total</div>
                                    <div class="stat-value-small">${props.total_sites}</div>
                                </div>
                                <div class="region-stat">
                                    <div class="percentage">${percentage.toFixed(1)}%</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('breakdownContent').innerHTML = breakdownHtml;
            })
            .catch(err => {
                document.getElementById('breakdownContent').innerHTML = `<div style="padding: 20px; color: red;">Error: ${err.message}</div>`;
            });
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
